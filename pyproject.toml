[project]
name = "genai-llm-ai-content-studio"
version = "1.0.0"
description = "Six-feature AI Content Studio powered by the Google Gemini API, FastAPI, and Streamlit."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "streamlit>=1.39,<2.0",
  "google-genai>=1.0,<2.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "requests>=2.31,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
